name: collect

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 06:30 Cyprus, before the day's price changes land
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Both checkouts use a personal access token, not GITHUB_TOKEN: commits made
      # with GITHUB_TOKEN do not count as repository activity, and GitHub disables
      # scheduled workflows after 60 days without activity. Trackers die silently
      # this way.
      - name: Check out public repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - name: Check out private data repo
        uses: actions/checkout@v4
        with:
          repository: George649451/cy-grocery-index-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python collector/collect.py --data-dir data-private --public-dir data

      - name: Commit private change-log
        working-directory: data-private
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "george.g@cxm.com"
          git add -A
          git commit -m "collect $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push

      - name: Commit public master and summary
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "george.g@cxm.com"
          git add data
          git commit -m "collect $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
