name: fuel

on:
  # Schedule removed 19 Nov 2026. The observatory moved on 30 Oct 2026 to
  # petroleumprices.meci.gov.cy, which requires a CAPTCHA for every search; the old form
  # returns "Not Found". Restore the crons (04:15, 10:15, 16:15 UTC) only with a source
  # that permits automated collection.
  workflow_dispatch:

concurrency:
  group: fuel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect fuel prices (Retail Fuel Price Observatory)
        run: python collector/fuel.py --public-dir data
      - name: Commit
        if: always()   # a failed collection still records its row in data/fuel/runs.csv
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "george.g@cxm.com"
          git add data/fuel
          git commit -m "fuel $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
