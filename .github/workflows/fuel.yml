name: fuel

on:
  schedule:
    # The European Commission publishes the Weekly Oil Bulletin on Thursdays with the prices
    # in force on Monday. Three attempts a week; each run rewrites the whole weekly file
    # from the source workbook, so a late publication or a revision is picked up.
    - cron: "0 15 * * 4"   # Thursday 17:00 Cyprus
    - cron: "0 7 * * 5"    # Friday 09:00 Cyprus
    - cron: "0 7 * * 1"    # Monday 09:00 Cyprus
  workflow_dispatch:

# Per-station daily collection ended on 29 Oct 2026: the national observatory moved to
# petroleumprices.meci.gov.cy, which requires a CAPTCHA for every search. The station
# collector is kept in the repository but is no longer scheduled.

concurrency:
  group: fuel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect weekly fuel prices (EC Weekly Oil Bulletin)
        run: python collector/fuel_ec.py --public-dir data
      - name: Commit
        if: always()   # a failed run still records its row in data/fuel/ec_runs.csv
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "George649451@users.noreply.github.com"
          git add data/fuel
          git commit -m "fuel weekly $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 20))
          done
          exit 1
