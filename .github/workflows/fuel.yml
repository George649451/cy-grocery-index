name: fuel

on:
  schedule:
    # Three attempts a day; the collector exits immediately once the day has a successful
    # run, so the later attempts only do work when the observatory was down in the morning
    # (it was unreachable on 7 of the first 30 days). GitHub's cron can start hours late.
    - cron: "15 4 * * *"    # 07:15 Cyprus
    - cron: "15 10 * * *"   # 13:15 Cyprus
    - cron: "15 16 * * *"   # 19:15 Cyprus
  workflow_dispatch:

concurrency:
  group: fuel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect fuel prices (Retail Fuel Price Observatory)
        run: python collector/fuel.py --public-dir data
      - name: Commit
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "george.g@cxm.com"
          git add data/fuel
          git commit -m "fuel $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
