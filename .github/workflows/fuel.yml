name: fuel

on:
  schedule:
    - cron: "15 4 * * *"   # 04:15 UTC = 07:15 Cyprus; separate from the grocery run so a slow observatory never blocks it
  workflow_dispatch:

concurrency:
  group: fuel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect fuel prices (Retail Fuel Price Observatory)
        run: python collector/fuel.py --public-dir data
      - name: Commit
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "george.g@cxm.com"
          git add data/fuel
          git commit -m "fuel $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          git pull --rebase
          git push
