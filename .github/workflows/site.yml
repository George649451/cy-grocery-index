name: site

on:
  push:
    branches: [main]
    paths: [site/**, data/**, index/build_site.py, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          python index/build_site.py --public-dir data --out _site/data.json
          cp site/index.html site/style.css site/app.js _site/
          # Version the script and stylesheet URLs so a browser never pairs a new page with a
          # cached old script (which left a newly added section empty on 23 Nov 2026).
          V=$(cat site/app.js site/style.css | sha1sum | cut -c1-10)
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|href=\"style.css\"|href=\"style.css?v=$V\"|" _site/index.html
          grep -q "app.js?v=$V" _site/index.html && grep -q "style.css?v=$V" _site/index.html
          mkdir -p _site/data && cp -R data/basket data/summary data/catalogue data/fuel data/utilities data/eating_out _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
