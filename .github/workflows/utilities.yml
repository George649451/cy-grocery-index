name: utilities

on:
  schedule:
    # Published tariffs change rarely; EAC posts a new fuel adjustment once a month.
    # Twice a week is enough to date a change to within a few days.
    - cron: "30 6 * * 1"   # Monday 08:30 Cyprus
    - cron: "30 6 * * 4"   # Thursday 08:30 Cyprus
  workflow_dispatch:

concurrency:
  group: utilities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  utilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional PDF reader (effective date of a new EAC tariff)
        run: pip install --quiet pypdf || echo "pypdf unavailable; effective dates will be left blank"
      - name: Check electricity and water tariffs
        run: python collector/utilities.py --public-dir data
      - name: Commit
        if: always()   # a failed source is still recorded in data/utilities/runs.csv
        run: |
          git config user.name "cy-grocery-index-bot"
          git config user.email "George649451@users.noreply.github.com"
          git add data/utilities
          git commit -m "utilities $(TZ=Europe/Nicosia date +%F)" || { echo "nothing to commit"; exit 0; }
          for attempt in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 20))
          done
          exit 1
